(function () {

  let active = false;

  function readSharedConsent() {

    const buttons = document.createElement('div');

    [['Odmítnout','denied'], ['Souhlasím','granted']].forEach(function (choice) {
      const button = document.createElement('button');
      button.type = 'button'; button.textContent = choice[0];
      button.style.cssText = 'cursor:pointer;border:1px solid #774a62;border-radius:7px;padding:8px 14px;background:'+(choice[1]==='granted'?'#774a62':'#fff')+';color:'+(choice[1]==='granted'?'#fff':'#774a62')+';font:inherit';

        if (!setConsent(choice[1])) return;
        bar.remove();
        if (choice[1] === 'granted') start();

          window.location.reload();

    event.preventDefault();
    window.academyManageConsent();
  });
  openSettingsFromLink();
  window.addEventListener('hashchange', openSettingsFromLink);
  window.addEventListener('focus', function () {
    if (active && getConsent() !== 'granted') {

  });
})();
