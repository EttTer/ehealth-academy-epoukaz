<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d617c"><title>ePoukaz v ordinaci | Webett eHealth Akademie</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#15314a;background:#f5f8fa}*{box-sizing:border-box}body{margin:0;line-height:1.58}button{font:inherit;cursor:pointer}a{color:#086f91}header{background:white;border-bottom:1px solid #dce7ed} .top{max-width:1050px;margin:auto;padding:19px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:18px;font-weight:800;letter-spacing:-.4px;color:#113951;text-decoration:none}.brand span{color:#0c8d99}.sub{font-size:12px;color:#577086}.layout{max-width:1050px;margin:36px auto;padding:0 24px;display:grid;grid-template-columns:225px 1fr;gap:30px}.side{align-self:start;position:sticky;top:25px}.side button{width:100%;text-align:left;background:transparent;border:0;border-radius:12px;padding:12px 13px;color:#426076;margin:3px 0}.side button.active{background:#e1f4f4;color:#09576a;font-weight:700}.main{min-width:0}.eyebrow{font-size:12px;text-transform:uppercase;font-weight:750;letter-spacing:1.6px;color:#0f8291}h1{font-size:clamp(29px,4.5vw,43px);line-height:1.17;letter-spacing:-1.15px;margin:10px 0 14px}h2{font-size:25px;letter-spacing:-.6px;margin:0 0 13px}h3{font-size:18px;margin:0 0 8px}.lead{font-size:17px;color:#516a7d;max-width:670px}.card{background:white;border:1px solid #dce6ec;border-radius:18px;padding:27px;margin:20px 0;box-shadow:0 4px 24px #17375208}.notice{border-left:4px solid #128e99;background:#eefafa;padding:15px 18px;border-radius:8px;margin:18px 0}.warning{border-left-color:#bb842e;background:#fff8ea}.muted{font-size:13px;color:#667d8f}.steps{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:18px 0}.pill{background:#e9f3f5;border-radius:30px;padding:7px 12px;font-size:13px;font-weight:600}.arrow{color:#7896a5}.option{display:block;width:100%;text-align:left;border:1.5px solid #d6e4ec;background:white;padding:14px 16px;margin:10px 0;border-radius:12px;color:#24455b;transition:.15s}.option:hover{border-color:#168598;background:#f4fcfd}.option.selected{background:#e5f7f6;border-color:#138b95;font-weight:650}.feedback{border-radius:12px;padding:15px 17px;margin-top:14px;background:#f0f7f9}.good{background:#e8f8ef}.bad{background:#fff6eb}.actions{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:22px 0}.btn{border:0;background:#096b83;color:white;border-radius:10px;padding:11px 20px;font-weight:700}.btn.secondary{background:#e8f1f5;color:#174e66}.btn:disabled{opacity:.4;cursor:not-allowed}.progress{height:7px;background:#e2edf1;border-radius:9px;overflow:hidden;margin-bottom:25px}.progress div{height:100%;background:#168e94;transition:width .2s}.footer{padding:25px 0 35px;color:#6c8495;font-size:13px}.hidden{display:none}.small-list li{margin:8px 0}.status{font-size:12px;background:#fff1db;color:#855414;padding:6px 10px;border-radius:30px;white-space:nowrap}.source-links li{margin:10px 0}details{border-top:1px solid #e2eaee;padding:12px 0}summary{font-weight:650;cursor:pointer}input[type=checkbox]{accent-color:#0a8390}.review{background:#fff8e9;border:1px solid #edd9b4;border-radius:12px;padding:14px 18px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:720px){.layout{display:block;margin:16px auto;padding:0 15px}.side{position:static;display:flex;overflow-x:auto;gap:6px;padding-bottom:12px}.side button{min-width:max-content;width:auto;font-size:13px;padding:9px}.top{padding:13px 16px}.card{padding:19px}.steps{gap:6px}.arrow{display:none}h2{font-size:23px}}
</style></head><body>
<header><div class="top"><a class="brand" href="#uvod" id="logo">Webett <span>eHealth Akademie</span></a><div><div class="sub">EHA-02 · ePoukaz v ordinaci</div><span class="status">Před odbornou recenzí</span></div></div></header>
<div class="layout"><nav class="side" aria-label="Obsah modulu"><button data-page="0" class="active">01 · Jak funguje ePoukaz</button><button data-page="1">02 · Vystavte ePoukaz</button><button data-page="2">03 · Řešení komplikací</button><button data-page="3">04 · Ověřte znalosti</button></nav><main class="main" id="content" aria-live="polite"></main></div>
<script>
const pages=['Jak funguje ePoukaz','Vystavte ePoukaz','Řešení komplikací','Ověřte znalosti'];
let page=0,step=0,caseStep=0,answers={},caseAnswers={},quizAnswers={},quizIndex=0;
const source = {
 sukl:'https://sukl.gov.cz/wp-content/uploads/2026/01/Prezentace_1_Pracovni-skupina-pro-farmacii_20251216.pdf',
 nzip:'https://www.nzip.cz/clanek/1393-elektronicky-poukaz-na-zdravotnicke-prostredky-epoukaz',
 send:'https://epreskripce.gov.cz/faq/4-jakym-zpusobem-je-mozne-predat-identifikator-pacientovi/',
 approval:'https://epreskripce.gov.cz/wp-content/uploads/2025/11/ZP_vyzadujici_schvaleni_pojistovnou.pdf',
 validity:'https://epreskripce.gov.cz/faq/30-jakou-je-mozne-nastavit-platnost-epoukazu-a-kdo-ji-muze-prodlouzit/',
 rules:'https://sukl.gov.cz/zdravotnicke-prostredky/otazky-a-odpovedi-zp/pravidla-pro-predepisovani-a-vydej-zdravotnickych-prostredku-od-1-1-2026/'
};
const link=(key,label)=>'<a href="'+source[key]+'" target="_blank" rel="noopener noreferrer">'+label+' ↗</a>';
const questions=[
 {title:'Rozhodnutí o předpisu',q:'Ortéza je dostupná v katalogu vašeho AIS. Co musíte udělat před vystavením ePoukazu?',opts:['Ověřit klinickou indikaci, preskripční omezení a případné podmínky úhrady.','Nic dalšího; přítomnost v AIS automaticky potvrzuje oprávnění.','Vystavit listinný poukaz.'],correct:0,why:'Katalog AIS není dokladem oprávnění k preskripci ani úhradě. Konkrétní kód a odbornost musí odpovídat aktuálním podmínkám.'},
 {title:'Obsah ePoukazu',q:'Pacient potřebuje ortézu a samostatně kódované příslušenství. Jak postupovat?',opts:['Obě položky vložím do jednoho poukazu.','Každá samostatně kódovaná položka vyžaduje vlastní ePoukaz.','Příslušenství přidám do poznámky bez další kontroly.'],correct:1,why:'Na jeden ePoukaz lze předepsat jednu položku (jeden kód). Nejde o limit počtu kusů stejné položky, který podléhá vlastním pravidlům.'},
 {title:'Předání pacientovi',q:'Pacient nemá chytrý telefon ani e-mail. Jak získá identifikátor?',opts:['Elektronický poukaz nelze využít.','Musí se přihlásit do mobilní aplikace.','Předáte mu vytištěnou průvodku s identifikátorem.'],correct:2,why:'Identifikátor lze předat také na vytištěné průvodce. Průvodka není listinným poukazem.'},
 {title:'Návaznost na výdej',q:'Pacient má vystavený ePoukaz, který nevyžaduje schválení. Které tvrzení je správné?',opts:['Získání identifikátoru samo o sobě potvrzuje převzetí pomůcky.','Pacient ePoukaz uplatní u oprávněného výdejce; vlastní výdej může nastat později.','Výdej musí vždy proběhnout v den vystavení.'],correct:1,why:'Rozlišujeme vystavení, předání identifikátoru, uplatnění a skutečný výdej. Pro datum platnosti je zásadní včasné uplatnění.'}
];
const problems=[
 {title:'Schválení zdravotní pojišťovnou',q:'U prostředku vyžadujícího schválení pojišťovna požádala o doplnění údajů. Co uděláte?',opts:['Doplníte požadované informace a znovu předáte ke schválení.','Bez dalšího vydáte pacientovi papírový poukaz.','Považujete žádost za schválenou.'],correct:0,why:'Dožádání informací není schválení. Opravte údaje a znovu předejte ePoukaz pojišťovně. Při zamítnutí je nutné řešit důvod a další klinický i administrativní postup. Pacient může mít identifikátor již před schválením, ale výdej zatím není možný.'},
 {title:'Uplatnění a pozdější výdej',q:'Pacient uplatnil platný ePoukaz u výdejce, ale pomůcka dorazí až po datu uvedené platnosti. Je automaticky nutný nový poukaz?',opts:['Ano, protože datum platnosti je vždy posledním dnem fyzického výdeje.','Ne automaticky; rozhodující je včasné uplatnění a stav poukazu.','Ano, a nový poukaz musí být listinný.'],correct:1,why:'Datum platnosti označuje lhůtu pro uplatnění, nikoliv nutně poslední den výdeje. Pokud pacient poukaz vůbec neuplatnil včas, je situace jiná. Výdejce musí postupovat podle příslušných pravidel.'},
 {title:'Závažný technický výpadek',q:'Systém má závažnou poruchu a ePoukaz není možné vystavit. Jaký postup je přípustný?',opts:['Listinný poukaz je vždy možný při jakémkoliv nepohodlí s AIS.','Při splnění zákonné výjimky vystavíte listinný poukaz a uvedete důvod.','Při výpadku se poukazy nesmějí vystavovat žádným způsobem.'],correct:1,why:'Listinné výjimky jsou omezené zákonem: mimo jiné závažný technický důvod. Zákon vymezuje rovněž další specifické případy. Na listinném poukazu se uvádí důvod.'}
];
const test=[
 {q:'Pacient nemá mobil ani e-mail. Jak mu předat ePoukaz?',opts:['Vytištěnou průvodkou s identifikátorem.','Není možné vystavit ePoukaz.','Jen přes účet v aplikaci.'],correct:0,why:'Pacient může získat vytištěnou průvodku; nejde o listinný poukaz.'},
 {q:'Můžete na jeden ePoukaz uvést dva různé kódy prostředků?',opts:['Ano, pokud spolu souvisejí.','Ne, jeden poukaz obsahuje jednu samostatně kódovanou položku.','Ano, pokud jde o stejnou diagnózu.'],correct:1,why:'Jeden ePoukaz = jeden kód prostředku.'},
 {q:'Pojišťovna vrátila ePoukaz k dožádání. Jak postupovat?',opts:['Považovat jej za schválený.','Zrušit bez komunikace s pacientem.','Doplnit údaje a znovu předat ke schválení.'],correct:2,why:'Dožádání znamená, že schvalovací proces zatím není dokončen.'},
 {q:'Pacient včas uplatnil ePoukaz, ale zdravotnický prostředek bude dodán později. Co platí?',opts:['Výdej může za stanovených podmínek nastat po datu platnosti.','Vždy je třeba vystavit nový poukaz.','Výdej už není možný.'],correct:0,why:'Je nutné rozlišit datum uplatnění a datum fyzického výdeje.'},
 {q:'Kdy lze místo elektronického vystavit listinný poukaz?',opts:['Kdykoliv si jej pacient přeje.','Pouze při některé zákonné výjimce s uvedením důvodu.','Kdykoliv ordinace používá starší software.'],correct:1,why:'Zákonné výjimky zahrnují vymezený rodinný poukaz, specifickou neodkladnou péči ve vlastním sociálním prostředí a závažný technický důvod. Nestačí pohodlí ani chybějící modernizace AIS.'}
];
function nav(next){page=Math.max(0,Math.min(3,next));document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',Number(b.dataset.page)===page);b.setAttribute('aria-current',Number(b.dataset.page)===page?'step':'false')});render();window.scrollTo({top:0,behavior:'smooth'})}
function choices(item,selected,callback){return item.opts.map((o,i)=>'<button class="option '+(selected===i?'selected':'')+'" onclick="'+callback+'('+i+')">'+String.fromCharCode(65+i)+'. '+o+'</button>').join('')}
function result(item,selected){if(selected===undefined)return '';return '<div class="feedback '+(selected===item.correct?'good':'bad')+'" role="status"><b>'+(selected===item.correct?'Správně':'Zkuste si zapamatovat správný postup')+'</b><p>'+item.why+'</p></div>'}
function buttons(back,next,disabled=false,label='Pokračovat'){return '<div class="actions"><button class="btn secondary" onclick="'+back+'">← Zpět</button><button class="btn" '+(disabled?'disabled':'')+' onclick="'+next+'">'+label+' →</button></div>'}
function intro(){return '<div class="eyebrow">Webett eHealth Akademie · Modul EHA-02</div><h1>ePoukaz v ordinaci</h1><p class="lead">Od správné preskripce po předání pacientovi a výdej zdravotnického prostředku. Prakticky, na situacích z ordinace.</p><div class="notice"><b>Aktuální stav · ověřeno 19. 10. 2026</b><p>Od 1. 1. 2026 se zdravotnické prostředky předepisované na poukaz standardně předepisují elektronicky. Listinné poukazy jsou přípustné jen v zákonem stanovených případech.</p><div class="muted">'+link('rules','Pravidla SÚKL')+' · '+link('nzip','NZIP')+'</div></div><div class="card"><h2>Co se naučíte</h2><ul class="small-list"><li>Ověřit indikaci, preskripční oprávnění a podmínky úhrady.</li><li>Vystavit a předat modelový ePoukaz pacientovi.</li><li>Rozlišovat schválení, uplatnění a výdej.</li><li>Zvolit bezpečný postup při komplikacích a zákonných výjimkách.</li></ul></div><div class="card"><h2>Jak probíhá cesta ePoukazu</h2><div class="steps"><span class="pill">Preskripce</span><span class="arrow">→</span><span class="pill">Předání identifikátoru</span><span class="arrow">→</span><span class="pill">Uplatnění</span><span class="arrow">→</span><span class="pill">Výdej</span></div><p>Pokud prostředek vyžaduje schválení pojišťovnou, přidávají se další kroky. U individuálně zhotovovaných pomůcek může výdejna uplatnění zaznamenat již před schválením.</p><div class="muted">'+link('approval','Postup schvalování')+'</div></div><div class="notice warning"><b>Poznámka k simulaci</b><p>Používáme fiktivního pacienta a záměrně neuvádíme neověřený kód ortézy ani výši úhrady. Model ukazuje rozhodovací proces, nikoliv konkrétní ovládání AIS.</p></div>'+buttons('nav(0)','nav(1)',false,'Začít simulaci')}
function simulation(){const item=questions[step],a=answers[step];return '<div class="eyebrow">02 · Modelová preskripce</div><h1>Vystavte ePoukaz</h1><p class="lead">Pacient 52 let po distorzi hlezna. Po klinickém vyšetření je zvažována stabilizační ortéza.</p><div class="notice warning">Výukový případ: konkrétní výrobek, kód, typ poukazu, preskripční omezení a úhrada vyžadují ověření v aktuálním seznamu SÚKL. Simulace není doporučením konkrétního prostředku.</div><div class="progress"><div style="width:'+((step+1)/4*100)+'%"></div></div><div class="card"><div class="eyebrow">Krok '+(step+1)+' ze 4</div><h2>'+item.title+'</h2><p>'+item.q+'</p>'+choices(item,a,'answerSim')+result(item,a)+'</div>'+buttons(step?'moveSim(-1)':'nav(0)',step===3?'nav(2)':'moveSim(1)',a===undefined,step===3?'Přejít ke komplikacím':'Další krok')}
function complications(){const item=problems[caseStep],a=caseAnswers[caseStep];return '<div class="eyebrow">03 · Komplikace</div><h1>Co když nastane problém?</h1><p class="lead">Vyberte vhodný další krok. Důležité je zachovat dostupnost pomůcky a návaznost péče.</p><div class="card"><div class="eyebrow">Situace '+(caseStep+1)+' ze 3</div><h2>'+item.title+'</h2><p>'+item.q+'</p>'+choices(item,a,'answerCase')+result(item,a)+'</div>'+(caseStep===0?'<details><summary>Jaké stavy může mít schvalovací proces?</summary><p>Po odeslání ke schválení může nastat například převzetí pojišťovnou, dožádání informací, schválení nebo zamítnutí. Zamítnutí není automatickým souhlasem s úhradou. Identifikátor lze předat i během čekání; výdej zatím nelze provést.</p><p class="muted">'+link('approval','Dokumentace schvalování')+'</p></details>':'')+(caseStep===1?'<details><summary>Co záměna a částečný výdej?</summary><p>Výdejce může za stanovených pravidel řešit záměnu či částečný výdej. Lékař by neměl automaticky vystavovat duplicitní ePoukaz, aniž ověří stav předchozího.</p></details>':'')+buttons(caseStep?'moveCase(-1)':'nav(1)',caseStep===2?'nav(3)':'moveCase(1)',a===undefined,caseStep===2?'Přejít k testu':'Další situace')}
function quiz(){if(quizIndex>=test.length){const score=test.reduce((s,q,i)=>s+(quizAnswers[i]===q.correct?1:0),0);return '<div class="eyebrow">04 · Výsledek</div><h1>Ověření porozumění</h1><div class="card"><h2>'+score+' / '+test.length+' správných odpovědí</h2><p>'+(score===5?'Výborně. Základní rozhodovací situace zvládáte.':'Projděte si ještě vysvětlení a podle potřeby si test zopakujte.')+'</p>'+test.map((q,i)=>'<details><summary>'+(i+1)+'. '+q.q+' · '+(quizAnswers[i]===q.correct?'✓':'K zopakování')+'</summary><p>'+q.why+'</p></details>').join('')+'<div class="actions"><button class="btn secondary" onclick="nav(0)">Zpět na úvod</button><button class="btn" onclick="restartQuiz()">Opakovat test</button></div></div>'+resources()}
const item=test[quizIndex],a=quizAnswers[quizIndex];return '<div class="eyebrow">04 · Test porozumění</div><h1>Ověřte znalosti</h1><div class="progress"><div style="width:'+((quizIndex+1)/test.length*100)+'%"></div></div><div class="card"><div class="eyebrow">Otázka '+(quizIndex+1)+' z '+test.length+'</div><h2>'+item.q+'</h2>'+choices(item,a,'answerQuiz')+result(item,a)+'</div>'+buttons(quizIndex?'moveQuiz(-1)':'nav(2)','moveQuiz(1)',a===undefined,quizIndex===test.length-1?'Zobrazit výsledek':'Další otázka')+(quizIndex===0?'<p class="muted">Test slouží k ověření porozumění, nikoli jako akreditované hodnocení odborné způsobilosti.</p>':'')}
function resources(){return '<div class="card"><h2>Zdroje a odborná kontrola</h2><ul class="source-links"><li>'+link('rules','SÚKL: pravidla od 1. ledna 2026')+'</li><li>'+link('sukl','SÚKL: odborná prezentace k ePoukazu')+'</li><li>'+link('send','ePreskripce: předání identifikátoru')+'</li><li>'+link('approval','ePreskripce: schvalování pojišťovnou')+'</li><li>'+link('validity','ePreskripce: platnost a prodloužení')+'</li><li>'+link('nzip','NZIP: informace pro pacienty')+'</li></ul><p class="muted">Obsahové zadání EHA-02 v1.2 · Aktualizováno 19. 10. 2026 · Další kontrola nejpozději 19. 1. 2027.</p><div class="review"><b>Odborná recenze dosud nebyla dokončena.</b><p>Modul je prototyp, nikoliv publikované a odborně garantované vzdělávání. Před zveřejněním zkontrolovat konkrétní preskripční příklad, právní stav a pacientské scénáře.</p></div></div>'}
function render(){document.getElementById('content').innerHTML=[intro,simulation,complications,quiz][page]()+ '<footer class="footer">Webett · eHealth Akademie · EHA-02 · Edukační prototyp bez osobních údajů</footer>'}
function answerSim(i){answers[step]=i;render()}function moveSim(delta){step=Math.max(0,Math.min(3,step+delta));render()}
function answerCase(i){caseAnswers[caseStep]=i;render()}function moveCase(delta){caseStep=Math.max(0,Math.min(2,caseStep+delta));render()}
function answerQuiz(i){quizAnswers[quizIndex]=i;render()}function moveQuiz(delta){quizIndex=Math.max(0,Math.min(test.length,quizIndex+delta));render()}function restartQuiz(){quizIndex=0;quizAnswers={};render()}
document.querySelectorAll('[data-page]').forEach(btn=>btn.addEventListener('click',()=>nav(Number(btn.dataset.page))));document.getElementById('logo').addEventListener('click',e=>{e.preventDefault();nav(0)});render();
</script></body></html>
